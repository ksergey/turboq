name: build-and-test

on: [push]

env:
    CMAKE_VERSION: 3.29.2
    NINJA_VERSION: 1.9.0

jobs:
  build:
    name: ${{ matrix.build_type }} build with ${{ matrix.compiler }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build_type: [ 'Debug', 'Release' ]
        os: [ 'ubuntu-24.04' ]
        compiler: [ 'gcc-14', 'gcc-15', 'gcc-16', 'clang-20', 'clang-21', 'clang-22' ]

    steps:
      - uses: actions/checkout@v7

      - name: download ninja and cmake
        id: cmake_and_ninja
        shell: cmake -P {0}
        run: |
          set(cmake_version $ENV{CMAKE_VERSION})
          set(ninja_version $ENV{NINJA_VERSION})

          message(STATUS "Using host CMake version: ${CMAKE_VERSION}")

          set(ninja_suffix "linux.zip")
          set(cmake_suffix "linux-x86_64.tar.gz")
          set(cmake_dir "cmake-${cmake_version}-linux-x86_64/bin")

          set(ninja_url "https://github.com/ninja-build/ninja/releases/download/v${ninja_version}/ninja-${ninja_suffix}")
          file(DOWNLOAD "${ninja_url}" ./ninja.zip SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./ninja.zip)

          set(cmake_url "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/cmake-${cmake_version}-${cmake_suffix}")
          file(DOWNLOAD "${cmake_url}" ./cmake.zip SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./cmake.zip)

          # Save the path for other steps
          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${cmake_dir}" cmake_dir)
          file(APPEND $ENV{GITHUB_OUTPUT} "cmake_dir=${cmake_dir}")

          execute_process(
            COMMAND chmod +x ninja
            COMMAND chmod +x ${cmake_dir}/cmake
          )

      - name: install gcc-14
        id: install_gcc_14
        if: matrix.compiler == 'gcc-14'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install -y g++-14 gcc-14
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: install gcc-15
        id: install_gcc_15
        if: matrix.compiler == 'gcc-15'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install -y g++-15 gcc-15
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: install gcc-16
        id: install_gcc_16
        if: matrix.compiler == 'gcc-16'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install -y g++-16 gcc-16
          echo "CC=gcc-16" >> $GITHUB_ENV
          echo "CXX=g++-16" >> $GITHUB_ENV

      - name: install clang-19
        id: install_clang_19
        if: matrix.compiler == 'clang-19'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          curl -O -L https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          echo "CC=clang-19" >> $GITHUB_ENV
          echo "CXX=clang++-19" >> $GITHUB_ENV

      - name: install clang-20
        id: install_clang_20
        if: matrix.compiler == 'clang-20'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          curl -O -L https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          echo "CC=clang-20" >> $GITHUB_ENV
          echo "CXX=clang++-20" >> $GITHUB_ENV

      - name: install clang-21
        id: install_clang_21
        if: matrix.compiler == 'clang-21'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          curl -O -L https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          echo "CC=clang-21" >> $GITHUB_ENV
          echo "CXX=clang++-21" >> $GITHUB_ENV

      - name: install clang-22
        id: install_clang_22
        if: matrix.compiler == 'clang-22'
        shell: bash
        working-directory: ${{ env.HOME }}
        run: |
          curl -O -L https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          echo "CC=clang-22" >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV

      - name: configure
        shell: cmake -P {0}
        run: |
          set(ENV{PATH} "$ENV{GITHUB_WORKSPACE}:$ENV{PATH}")

          execute_process(
            COMMAND ${{ steps.cmake_and_ninja.outputs.cmake_dir }}/cmake
              -S .
              -B build
              -G Ninja
              -DCMAKE_MAKE_PROGRAM=ninja
              -DCMAKE_C_COMPILER=${{ env.CC }}
              -DCMAKE_CXX_COMPILER=${{ env.CXX }}
              -DCMAKE_VERBOSE_MAKEFILE=ON
              -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Bad exit status")
          endif()

      - name: build
        shell: cmake -P {0}
        continue-on-error: false
        run: |
          set(ENV{NINJA_STATUS} "[%f/%t %o/sec] ")
          set(ENV{PATH} "$ENV{GITHUB_WORKSPACE}:$ENV{PATH}")

          execute_process(
            COMMAND ${{ steps.cmake_and_ninja.outputs.cmake_dir }}/cmake --build build
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Bad exit status")
          endif()

      - name: run tests
        shell: cmake -P {0}
        continue-on-error: false
        run: |
          include(ProcessorCount)
          ProcessorCount(N)

          set(ENV{CTEST_OUTPUT_ON_FAILURE} "ON")

          execute_process(
            COMMAND ${{ steps.cmake_and_ninja.outputs.cmake_dir }}/ctest --verbose --test-dir code -j ${N}
            WORKING_DIRECTORY build
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Running tests failed!")
          endif()

  sanitizers:
    name: ${{ matrix.sanitizer }} with ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ASan/UBSan/LeakSanitizer and ThreadSanitizer instrument a binary in incompatible ways
        # and can't be combined into one build -- each sanitizer here is its own build+test run.
        # Not run across the full compiler matrix above: sanitizer findings are rarely specific to
        # a particular compiler minor version, so one representative each of GCC and Clang gives
        # most of the value for a fraction of the CI time.
        sanitizer: [ 'asan-ubsan-lsan', 'tsan' ]
        compiler: [ 'gcc-14', 'clang-20' ]

    steps:
      - uses: actions/checkout@v7

      - name: download ninja and cmake
        id: cmake_and_ninja
        shell: cmake -P {0}
        run: |
          set(cmake_version $ENV{CMAKE_VERSION})
          set(ninja_version $ENV{NINJA_VERSION})

          set(ninja_suffix "linux.zip")
          set(cmake_suffix "linux-x86_64.tar.gz")
          set(cmake_dir "cmake-${cmake_version}-linux-x86_64/bin")

          set(ninja_url "https://github.com/ninja-build/ninja/releases/download/v${ninja_version}/ninja-${ninja_suffix}")
          file(DOWNLOAD "${ninja_url}" ./ninja.zip SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./ninja.zip)

          set(cmake_url "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/cmake-${cmake_version}-${cmake_suffix}")
          file(DOWNLOAD "${cmake_url}" ./cmake.zip SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./cmake.zip)

          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${cmake_dir}" cmake_dir)
          file(APPEND $ENV{GITHUB_OUTPUT} "cmake_dir=${cmake_dir}")

          execute_process(
            COMMAND chmod +x ninja
            COMMAND chmod +x ${cmake_dir}/cmake
          )

      - name: install gcc-14
        if: matrix.compiler == 'gcc-14'
        shell: bash
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install -y g++-14 gcc-14
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV

      - name: install clang-20
        if: matrix.compiler == 'clang-20'
        shell: bash
        run: |
          curl -O -L https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          echo "CC=clang-20" >> $GITHUB_ENV
          echo "CXX=clang++-20" >> $GITHUB_ENV

      - name: configure
        shell: cmake -P {0}
        run: |
          set(ENV{PATH} "$ENV{GITHUB_WORKSPACE}:$ENV{PATH}")

          if ("${{ matrix.sanitizer }}" STREQUAL "asan-ubsan-lsan")
            set(sanitizer_flag "-Dturboq_SANITIZER=ON")
          else()
            set(sanitizer_flag "-Dturboq_TSAN=ON")
          endif()

          execute_process(
            COMMAND ${{ steps.cmake_and_ninja.outputs.cmake_dir }}/cmake
              -S .
              -B build
              -G Ninja
              -DCMAKE_MAKE_PROGRAM=ninja
              -DCMAKE_C_COMPILER=${{ env.CC }}
              -DCMAKE_CXX_COMPILER=${{ env.CXX }}
              -DCMAKE_VERBOSE_MAKEFILE=ON
              -DCMAKE_BUILD_TYPE=Debug
              ${sanitizer_flag}
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Bad exit status")
          endif()

      - name: build
        shell: cmake -P {0}
        continue-on-error: false
        run: |
          set(ENV{NINJA_STATUS} "[%f/%t %o/sec] ")
          set(ENV{PATH} "$ENV{GITHUB_WORKSPACE}:$ENV{PATH}")

          execute_process(
            COMMAND ${{ steps.cmake_and_ninja.outputs.cmake_dir }}/cmake --build build
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Bad exit status")
          endif()

      - name: run tests
        shell: cmake -P {0}
        continue-on-error: false
        env:
          # sanitizer runtimes abort the process on the first diagnostic by default; make sure
          # they actually do (rather than just printing and continuing), and keep leak detection
          # on for the ASan job -- verified locally that this library doesn't trip it (mmap
          # regions/fds are properly released through MappedRegion/File's RAII).
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          include(ProcessorCount)
          ProcessorCount(N)

          set(ENV{CTEST_OUTPUT_ON_FAILURE} "ON")

          execute_process(
            COMMAND ${{ steps.cmake_and_ninja.outputs.cmake_dir }}/ctest --verbose --test-dir code -j ${N}
            WORKING_DIRECTORY build
            RESULT_VARIABLE result
          )
          if (NOT result EQUAL 0)
            message(FATAL_ERROR "Running tests failed!")
          endif()
